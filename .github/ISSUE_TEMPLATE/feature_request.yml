name: Feature request
description: Suggest a capability or improvement for Sutra
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the user problem first, then
        the proposed change. Keep the project's single-node, local-inference
        architecture in mind.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This request is within the project's scope and limitations.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or UI you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other approaches.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion
        - Indexing / processing
        - Search / retrieval
        - Frontend / UI
        - Deployment / operations
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and trade-offs
      description: Does this require a new service, database change, model change, or breaking API change?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this.
          required: false
