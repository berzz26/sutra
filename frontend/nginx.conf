server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access. The browser only talks to this origin; no
    # CORS configuration or build-time backend URL is required.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router uses client-side routes, so unknown paths fall back to the
    # SPA entry point instead of returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache hashed Vite assets aggressively; index.html must stay fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
